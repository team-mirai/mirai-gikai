name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          # v2.106.0 の auto_expose_new_tables 変更による権限エラーは、
          # supabase/migrations/20260719090000_grant_service_role_privileges_on_public_schema.sql
          # の明示 GRANT で恒久対応済みのため latest を使用する (#878)
          version: latest

      - name: Start Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,realtime,edge-runtime,supavisor,inbucket

      - name: Export Supabase env vars
        run: |
          {
            echo "SUPABASE_URL=http://127.0.0.1:54421"
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54421"
            supabase status -o env \
              | grep -E '^(PUBLISHABLE_KEY|SECRET_KEY)=' \
              | sed -e 's/^PUBLISHABLE_KEY="\(.*\)"$/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/' \
                    -e 's/^SECRET_KEY="\(.*\)"$/SUPABASE_SECRET_KEY=\1/'
          } >> "$GITHUB_ENV"

      - name: Run Integration Tests with Coverage
        run: pnpm test:integration:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./web/coverage-integration/coverage-final.json
          disable_search: true
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
